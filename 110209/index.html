<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Player - 110209</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ============================================
                   RESET & BASE
                   ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        /* ============================================
                   VIDEO WRAPPER
                   ============================================ */
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        /* ============================================
                   LOADING SPINNER
                   ============================================ */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            display: none;
            z-index: 5;
        }

        .loading-spinner.show {
            display: block;
        }

        @keyframes spin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* ============================================
                   BIG PLAY BUTTON
                   ============================================ */
        .big-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 0, 0.85);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            z-index: 10;
            pointer-events: auto;
        }

        .big-play-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(255, 0, 0, 1);
        }

        .big-play-btn.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        /* ============================================
                   CONTROLS OVERLAY
                   ============================================ */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            padding: 40px 20px 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 20;
        }

        .video-wrapper:hover .controls-overlay,
        .controls-overlay.show {
            opacity: 1;
        }

        /* ============================================
                   PROGRESS BAR
                   ============================================ */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            margin-bottom: 12px;
        }

        .progress-container:hover {
            height: 8px;
        }

        .progress-bar {
            height: 100%;
            background: #ff0000;
            border-radius: 4px;
            width: 0%;
            position: relative;
            transition: height 0.1s;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4px;
            width: 14px;
            height: 14px;
            background: #ff0000;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-container:hover .progress-bar::after {
            opacity: 1;
        }

        /* ============================================
                   CONTROLS ROW
                   ============================================ */
        .controls-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .controls-row button {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls-row button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .controls-row .time {
            font-size: 14px;
            color: #ccc;
            font-variant-numeric: tabular-nums;
            min-width: 100px;
        }

        .controls-row .volume-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-row .volume-wrap input[type="range"] {
            width: 60px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            outline: none;
            transition: width 0.2s;
        }

        .controls-row .volume-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            cursor: pointer;
        }

        .controls-row .volume-wrap input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .controls-row .speed-select {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .controls-row .speed-select option {
            background: #1a1a1a;
            color: #fff;
        }

        .controls-row .spacer {
            flex: 1;
        }

        /* ============================================
                   VIDEO TITLE
                   ============================================ */
        .video-title {
            font-size: 28px;
            font-weight: 700;
            margin: 24px 0 20px;
            color: #fff;
            letter-spacing: -0.5px;
        }

        /* ============================================
                   THUMBNAILS SECTION
                   ============================================ */
        .thumbnails-section {
            margin-top: 8px;
        }

        .thumbnails-section .label {
            font-size: 18px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 16px;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .thumbnail-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .thumbnail-item {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
            aspect-ratio: 16 / 9;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .thumbnail-item:hover {
            transform: scale(1.005);
            box-shadow: 0 4px 24px rgba(255, 0, 0, 0.08);
        }

        .thumbnail-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ============================================
                   RESPONSIVE
                   ============================================ */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .controls-row {
                gap: 8px;
            }

            .controls-row button {
                font-size: 16px;
                padding: 2px 4px;
            }

            .controls-row .time {
                font-size: 12px;
                min-width: 80px;
            }

            .controls-row .volume-wrap input[type="range"] {
                width: 40px;
            }

            .video-title {
                font-size: 20px;
                margin: 16px 0 12px;
            }

            .thumbnails-section .label {
                font-size: 15px;
                margin-bottom: 12px;
            }

            .thumbnail-list {
                gap: 8px;
            }

            .thumbnail-item {
                border-radius: 8px;
            }
        }

        @media (max-width: 480px) {
            .controls-row .volume-wrap input[type="range"] {
                width: 30px;
            }

            .controls-row .speed-select {
                font-size: 12px;
                padding: 2px 6px;
            }

            .video-title {
                font-size: 17px;
            }

            .big-play-btn {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ==========================================
        VIDEO PLAYER
        ========================================== -->
        <div class="video-wrapper" id="videoWrapper">

            <video id="videoPlayer" preload="metadata">
                <source src="https://pub-23a7df68d600433887519b69cfc888b4.r2.dev/new/110209.mp4" type="video/mp4" />
                Your browser does not support the video tag.
            </video>

            <!-- Loading Spinner -->
            <div class="loading-spinner" id="loadingSpinner"></div>

            <!-- Big Play Button -->
            <button class="big-play-btn" id="bigPlayBtn">
                <i class="fas fa-play"></i>
            </button>

            <!-- Controls Overlay -->
            <div class="controls-overlay" id="controlsOverlay">

                <!-- Progress Bar -->
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <!-- Controls Row -->
                <div class="controls-row">

                    <!-- Play/Pause -->
                    <button id="playBtn" title="Play / Pause">
                        <i class="fas fa-play"></i>
                    </button>

                    <!-- Rewind 10s -->
                    <button id="rewindBtn" title="Rewind 10s">
                        <i class="fas fa-backward"></i>
                    </button>

                    <!-- Forward 10s -->
                    <button id="forwardBtn" title="Forward 10s">
                        <i class="fas fa-forward"></i>
                    </button>

                    <!-- Time Display -->
                    <span class="time" id="timeDisplay">0:00 / 0:00</span>

                    <!-- Volume -->
                    <div class="volume-wrap">
                        <button id="muteBtn" title="Mute / Unmute">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
                    </div>

                    <!-- Speed -->
                    <select class="speed-select" id="speedSelect">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                    </select>

                    <span class="spacer"></span>

                    <!-- Fullscreen -->
                    <button id="fullscreenBtn" title="Fullscreen">
                        <i class="fas fa-expand"></i>
                    </button>

                </div>
            </div>
        </div>

        <!-- ==========================================
        VIDEO TITLE
        ========================================== -->
        <h1 class="video-title" id="videoTitle">Sample Video Title - 110209</h1>

        <!-- ==========================================
        THUMBNAILS
        ========================================== -->
        <div class="thumbnails-section">
            <div class="label">📸 Scene Previews</div>
            <div class="thumbnail-list" id="thumbnailList">
                <!-- Injected by JavaScript -->
            </div>
        </div>

    </div>

    <!-- ==========================================
    JAVASCRIPT
    ========================================== -->
    <script>
        (function() {
            'use strict';

            // ==========================================
            // CONFIG — CHANGE THIS FOR EACH VIDEO
            // ==========================================
            const VIDEO_ID = '110209';
            const VIDEO_URL =
            `https://pub-23a7df68d600433887519b69cfc888b4.r2.dev/new/${VIDEO_ID}.mp4`;
            const THUMBNAIL_BASE = `/thumbnails/${VIDEO_ID}/`;

            // ==========================================
            // DOM REFS
            // ==========================================
            const video = document.getElementById('videoPlayer');
            const wrapper = document.getElementById('videoWrapper');
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');
            const playBtn = document.getElementById('playBtn');
            const bigPlayBtn = document.getElementById('bigPlayBtn');
            const rewindBtn = document.getElementById('rewindBtn');
            const forwardBtn = document.getElementById('forwardBtn');
            const timeDisplay = document.getElementById('timeDisplay');
            const muteBtn = document.getElementById('muteBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const speedSelect = document.getElementById('speedSelect');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const controlsOverlay = document.getElementById('controlsOverlay');
            const thumbnailList = document.getElementById('thumbnailList');
            const videoTitle = document.getElementById('videoTitle');

            // ==========================================
            // SET VIDEO SOURCE
            // ==========================================
            video.src = VIDEO_URL;
            videoTitle.textContent = `Sample Video Title - ${VIDEO_ID}`;

            // ==========================================
            // LOAD THUMBNAILS (1.png to 10.png)
            // ==========================================
            for (let i = 1; i <= 10; i++) {
                const item = document.createElement('div');
                item.className = 'thumbnail-item';
                const img = document.createElement('img');
                img.src = `${THUMBNAIL_BASE}${i}.png`;
                img.alt = `Thumbnail ${i}`;
                img.loading = 'lazy';
                // If image fails to load, show a placeholder
                img.onerror = function() {
                    this.style.background = '#1a1a1a';
                    this.style.minHeight = '100%';
                    this.alt = `Thumbnail ${i} (not found)`;
                };
                item.appendChild(img);
                thumbnailList.appendChild(item);
            }

            // ==========================================
            // VIDEO EVENTS
            // ==========================================
            video.addEventListener('loadstart', () => {
                loadingSpinner.classList.add('show');
            });

            video.addEventListener('canplay', () => {
                loadingSpinner.classList.remove('show');
            });

            video.addEventListener('play', () => {
                bigPlayBtn.classList.add('hidden');
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            });

            video.addEventListener('pause', () => {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                if (video.currentTime === 0 || video.ended) {
                    bigPlayBtn.classList.remove('hidden');
                }
            });

            video.addEventListener('ended', () => {
                bigPlayBtn.classList.remove('hidden');
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            });

            // ==========================================
            // BIG PLAY BUTTON
            // ==========================================
            bigPlayBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            // ==========================================
            // PLAY / PAUSE
            // ==========================================
            playBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            // Click on video toggles play/pause
            video.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            // ==========================================
            // REWIND / FORWARD (10s)
            // ==========================================
            rewindBtn.addEventListener('click', () => {
                video.currentTime = Math.max(0, video.currentTime - 10);
            });

            forwardBtn.addEventListener('click', () => {
                video.currentTime = Math.min(video.duration, video.currentTime + 10);
            });

            // ==========================================
            // PROGRESS BAR
            // ==========================================
            video.addEventListener('timeupdate', () => {
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.style.width = percent + '%';
                timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video
                .duration);
            });

            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const percent = clickX / rect.width;
                video.currentTime = percent * video.duration;
            });

            // ==========================================
            // VOLUME
            // ==========================================
            volumeSlider.addEventListener('input', () => {
                video.volume = parseFloat(volumeSlider.value);
                video.muted = false;
                updateVolumeIcon();
            });

            muteBtn.addEventListener('click', () => {
                video.muted = !video.muted;
                updateVolumeIcon();
                volumeSlider.value = video.muted ? 0 : (video.volume || 1);
            });

            function updateVolumeIcon() {
                if (video.muted || video.volume === 0) {
                    muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                } else if (video.volume < 0.5) {
                    muteBtn.innerHTML = '<i class="fas fa-volume-down"></i>';
                } else {
                    muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                }
            }

            // ==========================================
            // SPEED
            // ==========================================
            speedSelect.addEventListener('change', () => {
                video.playbackRate = parseFloat(speedSelect.value);
            });

            // ==========================================
            // FULLSCREEN
            // ==========================================
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
                } else {
                    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
                }
            });

            // ==========================================
            // KEYBOARD SHORTCUTS
            // ==========================================
            document.addEventListener('keydown', (e) => {
                // Space = toggle play
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (video.paused) video.play();
                    else video.pause();
                }
                // Arrow Right = forward 10s
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    video.currentTime = Math.min(video.duration, video.currentTime + 10);
                }
                // Arrow Left = rewind 10s
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    video.currentTime = Math.max(0, video.currentTime - 10);
                }
                // F = fullscreen
                if (e.key === 'f' || e.key === 'F') {
                    e.preventDefault();
                    fullscreenBtn.click();
                }
                // M = mute
                if (e.key === 'm' || e.key === 'M') {
                    e.preventDefault();
                    muteBtn.click();
                }
            });

            // ==========================================
            // SHOW CONTROLS ON MOUSE MOVE
            // ==========================================
            let controlsTimeout;

            wrapper.addEventListener('mousemove', () => {
                controlsOverlay.classList.add('show');
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    if (!video.paused) {
                        controlsOverlay.classList.remove('show');
                    }
                }, 3000);
            });

            wrapper.addEventListener('mouseleave', () => {
                if (!video.paused) {
                    controlsOverlay.classList.remove('show');
                }
            });

            wrapper.addEventListener('mouseenter', () => {
                controlsOverlay.classList.add('show');
            });

            // ==========================================
            // HELPER: formatTime
            // ==========================================
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return m + ':' + (s < 10 ? '0' : '') + s;
            }

            // ==========================================
            // VOLUME ICON INIT
            // ==========================================
            updateVolumeIcon();

            console.log(`🎬 Video ${VIDEO_ID} loaded!`);
        })();
    </script>

</body>
</html>
