<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Player - 110209</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ============================================
                   RESET & BASE
                   ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Remove blue highlight on click */
        *,
        *:focus,
        *:active {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        /* ============================================
                   VIDEO WRAPPER
                   ============================================ */
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
            cursor: pointer;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            pointer-events: none;
        }

        /* ============================================
                   LOADING SPINNER
                   ============================================ */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            display: none;
            z-index: 5;
        }

        .loading-spinner.show {
            display: block;
        }

        @keyframes spin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* ============================================
                   BIG PLAY BUTTON (YouTube Style)
                   ============================================ */
        .big-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.25);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 10;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        .big-play-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translate(-50%, -50%) scale(1.05);
        }

        .big-play-btn.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* ============================================
                   CONTROLS OVERLAY (YouTube Style)
                   ============================================ */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8) 60%, rgba(0, 0, 0, 0.95));
            padding: 50px 16px 14px;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 20;
            pointer-events: none;
        }

        .controls-overlay * {
            pointer-events: auto;
        }

        .video-wrapper:hover .controls-overlay,
        .controls-overlay.show {
            opacity: 1;
        }

        /* ============================================
                   PROGRESS BAR (Bigger + Smoother)
                   ============================================ */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            margin-bottom: 10px;
            transition: height 0.15s;
            pointer-events: auto;
        }

        .progress-container:hover {
            height: 12px;
        }

        .progress-container:hover .progress-bar::after {
            opacity: 1;
        }

        .progress-bar {
            height: 100%;
            background: #ff0000;
            border-radius: 4px;
            width: 0%;
            position: relative;
            transition: width 0.05s linear;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            right: -8px;
            top: -4px;
            width: 16px;
            height: 16px;
            background: #ff0000;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* ============================================
                   CONTROLS ROW (Simplified)
                   ============================================ */
        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls-row button {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
            pointer-events: auto;
        }

        .controls-row button:hover {
            background: rgba(255, 255, 255, 0.15);
            opacity: 1;
        }

        .controls-row .time {
            font-size: 13px;
            color: #ddd;
            font-variant-numeric: tabular-nums;
            min-width: 100px;
            letter-spacing: 0.3px;
            pointer-events: none;
        }

        .controls-row .volume-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-row .volume-wrap input[type="range"] {
            width: 50px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            outline: none;
            transition: width 0.2s;
            pointer-events: auto;
        }

        .controls-row .volume-wrap:hover input[type="range"] {
            width: 70px;
        }

        .controls-row .volume-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .controls-row .volume-wrap input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .controls-row .spacer {
            flex: 1;
        }

        /* ============================================
                   VIDEO TITLE
                   ============================================ */
        .video-title {
            font-size: 22px;
            font-weight: 600;
            margin: 16px 0 14px;
            color: #fff;
            letter-spacing: -0.3px;
        }

        /* ============================================
                   THUMBNAILS (Clean)
                   ============================================ */
        .thumbnails-section {
            margin-top: 4px;
        }

        .thumbnail-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .thumbnail-item {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #141414;
            aspect-ratio: 16 / 9;
            transition: transform 0.15s;
        }

        .thumbnail-item:hover {
            transform: scale(1.003);
        }

        .thumbnail-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        /* ============================================
                   RESPONSIVE
                   ============================================ */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .controls-row {
                gap: 6px;
            }

            .controls-row button {
                font-size: 15px;
                padding: 2px 4px;
            }

            .controls-row .time {
                font-size: 11px;
                min-width: 70px;
            }

            .controls-row .volume-wrap input[type="range"] {
                width: 30px;
            }

            .controls-row .volume-wrap:hover input[type="range"] {
                width: 40px;
            }

            .video-title {
                font-size: 17px;
                margin: 12px 0 10px;
            }

            .thumbnail-list {
                gap: 6px;
            }

            .thumbnail-item {
                border-radius: 6px;
            }

            .big-play-btn {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }

            .progress-container {
                height: 6px;
            }

            .progress-container:hover {
                height: 8px;
            }
        }

        @media (max-width: 480px) {
            .video-title {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ==========================================
        VIDEO PLAYER
        ========================================== -->
        <div class="video-wrapper" id="videoWrapper">

            <video id="videoPlayer" preload="metadata">
                <source src="https://pub-23a7df68d600433887519b69cfc888b4.r2.dev/new/110209.mp4" type="video/mp4" />
                Your browser does not support the video tag.
            </video>

            <!-- Loading Spinner -->
            <div class="loading-spinner" id="loadingSpinner"></div>

            <!-- Big Play Button -->
            <button class="big-play-btn" id="bigPlayBtn">
                <i class="fas fa-play"></i>
            </button>

            <!-- Controls Overlay -->
            <div class="controls-overlay" id="controlsOverlay">

                <!-- Progress Bar -->
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <!-- Controls Row -->
                <div class="controls-row">

                    <!-- Play/Pause -->
                    <button id="playBtn" title="Play / Pause">
                        <i class="fas fa-play"></i>
                    </button>

                    <!-- Time Display -->
                    <span class="time" id="timeDisplay">0:00 / 0:00</span>

                    <!-- Volume -->
                    <div class="volume-wrap">
                        <button id="muteBtn" title="Mute / Unmute">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
                    </div>

                    <span class="spacer"></span>

                    <!-- Fullscreen -->
                    <button id="fullscreenBtn" title="Fullscreen">
                        <i class="fas fa-expand"></i>
                    </button>

                </div>
            </div>
        </div>

        <!-- ==========================================
        VIDEO TITLE
        ========================================== -->
        <h1 class="video-title" id="videoTitle">Video Title - 110209</h1>

        <!-- ==========================================
        THUMBNAILS
        ========================================== -->
        <div class="thumbnails-section">
            <div class="thumbnail-list" id="thumbnailList">
                <!-- Injected by JavaScript -->
            </div>
        </div>

    </div>

    <!-- ==========================================
    JAVASCRIPT
    ========================================== -->
    <script>
        (function() {
            'use strict';

            // ==========================================
            // CONFIG — CHANGE THIS FOR EACH VIDEO
            // ==========================================
            const VIDEO_ID = '110209';
            const VIDEO_URL =
                `https://pub-23a7df68d600433887519b69cfc888b4.r2.dev/new/${VIDEO_ID}.mp4`;
            const THUMBNAIL_BASE = `/thumbnails/${VIDEO_ID}/`;

            // ==========================================
            // DOM REFS
            // ==========================================
            const video = document.getElementById('videoPlayer');
            const wrapper = document.getElementById('videoWrapper');
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');
            const playBtn = document.getElementById('playBtn');
            const bigPlayBtn = document.getElementById('bigPlayBtn');
            const timeDisplay = document.getElementById('timeDisplay');
            const muteBtn = document.getElementById('muteBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const controlsOverlay = document.getElementById('controlsOverlay');
            const thumbnailList = document.getElementById('thumbnailList');
            const videoTitle = document.getElementById('videoTitle');

            // ==========================================
            // SET VIDEO SOURCE
            // ==========================================
            video.src = VIDEO_URL;
            videoTitle.textContent = `Video Title - ${VIDEO_ID}`;

            // ==========================================
            // LOAD THUMBNAILS (1.png to 10.png)
            // ==========================================
            for (let i = 1; i <= 10; i++) {
                const item = document.createElement('div');
                item.className = 'thumbnail-item';
                const img = document.createElement('img');
                img.src = `${THUMBNAIL_BASE}${i}.png`;
                img.alt = `Thumbnail ${i}`;
                img.loading = 'lazy';
                img.onerror = function() {
                    this.style.background = '#141414';
                    this.style.minHeight = '100%';
                    this.alt = `Thumbnail ${i}`;
                };
                item.appendChild(img);
                thumbnailList.appendChild(item);
            }

            // ==========================================
            // VIDEO EVENTS
            // ==========================================
            video.addEventListener('loadstart', () => {
                loadingSpinner.classList.add('show');
            });

            video.addEventListener('canplay', () => {
                loadingSpinner.classList.remove('show');
            });

            video.addEventListener('play', () => {
                bigPlayBtn.classList.add('hidden');
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            });

            video.addEventListener('pause', () => {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                if (video.currentTime === 0 || video.ended) {
                    bigPlayBtn.classList.remove('hidden');
                }
            });

            video.addEventListener('ended', () => {
                bigPlayBtn.classList.remove('hidden');
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            });

            // ==========================================
            // BIG PLAY BUTTON
            // ==========================================
            bigPlayBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            // ==========================================
            // PLAY / PAUSE
            // ==========================================
            playBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            // Click on video toggles play/pause
            video.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            // ==========================================
            // PROGRESS BAR (Smooth + Clickable)
            // ==========================================
            let isDragging = false;

            video.addEventListener('timeupdate', () => {
                if (!isDragging) {
                    const percent = (video.currentTime / video.duration) * 100;
                    progressBar.style.width = percent + '%';
                }
                timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
            });

            // Click to seek
            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const percent = Math.max(0, Math.min(1, clickX / rect.width));
                video.currentTime = percent * video.duration;
                progressBar.style.width = percent * 100 + '%';
            });

            // Drag to seek (smooth)
            progressContainer.addEventListener('mousedown', (e) => {
                isDragging = true;
                const rect = progressContainer.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const percent = Math.max(0, Math.min(1, clickX / rect.width));
                video.currentTime = percent * video.duration;
                progressBar.style.width = percent * 100 + '%';
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const rect = progressContainer.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const percent = Math.max(0, Math.min(1, clickX / rect.width));
                    video.currentTime = percent * video.duration;
                    progressBar.style.width = percent * 100 + '%';
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // Touch support for mobile
            progressContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const rect = progressContainer.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                const percent = Math.max(0, Math.min(1, touchX / rect.width));
                video.currentTime = percent * video.duration;
                progressBar.style.width = percent * 100 + '%';
            });

            progressContainer.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const rect = progressContainer.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                const percent = Math.max(0, Math.min(1, touchX / rect.width));
                video.currentTime = percent * video.duration;
                progressBar.style.width = percent * 100 + '%';
            });

            // ==========================================
            // VOLUME
            // ==========================================
            volumeSlider.addEventListener('input', () => {
                video.volume = parseFloat(volumeSlider.value);
                video.muted = false;
                updateVolumeIcon();
            });

            muteBtn.addEventListener('click', () => {
                video.muted = !video.muted;
                updateVolumeIcon();
                volumeSlider.value = video.muted ? 0 : (video.volume || 1);
            });

            function updateVolumeIcon() {
                if (video.muted || video.volume === 0) {
                    muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                } else if (video.volume < 0.5) {
                    muteBtn.innerHTML = '<i class="fas fa-volume-down"></i>';
                } else {
                    muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                }
            }

            // ==========================================
            // FULLSCREEN
            // ==========================================
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
                } else {
                    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
                }
            });

            // ==========================================
            // KEYBOARD SHORTCUTS (Simplified)
            // ==========================================
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (video.paused) video.play();
                    else video.pause();
                }
                if (e.key === 'f' || e.key === 'F') {
                    e.preventDefault();
                    fullscreenBtn.click();
                }
                if (e.key === 'm' || e.key === 'M') {
                    e.preventDefault();
                    muteBtn.click();
                }
            });

            // ==========================================
            // SHOW CONTROLS ON MOUSE MOVE
            // ==========================================
            let controlsTimeout;

            wrapper.addEventListener('mousemove', () => {
                controlsOverlay.classList.add('show');
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    if (!video.paused) {
                        controlsOverlay.classList.remove('show');
                    }
                }, 3000);
            });

            wrapper.addEventListener('mouseleave', () => {
                if (!video.paused) {
                    controlsOverlay.classList.remove('show');
                }
            });

            wrapper.addEventListener('mouseenter', () => {
                controlsOverlay.classList.add('show');
            });

            // ==========================================
            // HELPER: formatTime
            // ==========================================
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return m + ':' + (s < 10 ? '0' : '') + s;
            }

            // ==========================================
            // VOLUME ICON INIT
            // ==========================================
            updateVolumeIcon();

            console.log(`🎬 Video ${VIDEO_ID} loaded!`);
        })();
    </script>

</body>
</html>
