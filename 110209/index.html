<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Player - 110209</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ============================================
                   RESET & BASE
                   ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Remove blue highlight on click */
        *,
        *:focus,
        *:active {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        /* ============================================
                   18+ POPUP OVERLAY
                   ============================================ */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        .popup-overlay.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .popup-box {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 50px 40px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .popup-box .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .popup-box h2 {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .popup-box .subtitle {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .popup-box .subtitle strong {
            color: #ff0000;
            font-weight: 600;
        }

        .popup-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .popup-btn {
            padding: 14px 48px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
            display: inline-block;
            min-width: 120px;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .popup-btn-yes {
            background: #ff0000;
            color: #fff;
        }

        .popup-btn-yes:hover {
            background: #cc0000;
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(255, 0, 0, 0.3);
        }

        .popup-btn-yes:active {
            transform: scale(0.97);
        }

        .popup-btn-no {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .popup-btn-no:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.03);
        }

        .popup-btn-no:active {
            transform: scale(0.97);
        }

        .popup-footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
            letter-spacing: 0.5px;
        }

        /* ============================================
                   VIDEO WRAPPER
                   ============================================ */
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
            cursor: pointer;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            pointer-events: none;
        }

        /* ============================================
                   LOADING SPINNER
                   ============================================ */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            display: none;
            z-index: 5;
        }

        .loading-spinner.show {
            display: block;
        }

        @keyframes spin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* ============================================
                   BIG PLAY BUTTON (YouTube Style)
                   ============================================ */
        .big-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.25);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 10;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        .big-play-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translate(-50%, -50%) scale(1.05);
        }

        .big-play-btn.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* ============================================
                   CONTROLS OVERLAY (YouTube Style)
                   ============================================ */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8) 60%, rgba(0, 0, 0, 0.95));
            padding: 50px 16px 14px;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 20;
            pointer-events: none;
        }

        .controls-overlay * {
            pointer-events: auto;
        }

        .video-wrapper:hover .controls-overlay,
        .controls-overlay.show {
            opacity: 1;
        }

        /* ============================================
                   PROGRESS BAR (Bigger + Smoother)
                   ============================================ */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            margin-bottom: 10px;
            transition: height 0.15s;
            pointer-events: auto;
        }

        .progress-container:hover {
            height: 12px;
        }

        .progress-container:hover .progress-bar::after {
            opacity: 1;
        }

        .progress-bar {
            height: 100%;
            background: #ff0000;
            border-radius: 4px;
            width: 0%;
            position: relative;
            transition: width 0.05s linear;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            right: -8px;
            top: -4px;
            width: 16px;
            height: 16px;
            background: #ff0000;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* ============================================
                   CONTROLS ROW (Simplified)
                   ============================================ */
        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls-row button {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
            pointer-events: auto;
        }

        .controls-row button:hover {
            background: rgba(255, 255, 255, 0.15);
            opacity: 1;
        }

        .controls-row .time {
            font-size: 13px;
            color: #ddd;
            font-variant-numeric: tabular-nums;
            min-width: 100px;
            letter-spacing: 0.3px;
            pointer-events: none;
        }

        .controls-row .volume-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-row .volume-wrap input[type="range"] {
            width: 50px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            outline: none;
            transition: width 0.2s;
            pointer-events: auto;
        }

        .controls-row .volume-wrap:hover input[type="range"] {
            width: 70px;
        }

        .controls-row .volume-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .controls-row .volume-wrap input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .controls-row .spacer {
            flex: 1;
        }

        /* ============================================
                   VIDEO TITLE
                   ============================================ */
        .video-title {
            font-size: 22px;
            font-weight: 600;
            margin: 16px 0 14px;
            color: #fff;
            letter-spacing: -0.3px;
        }

        /* ============================================
                   THUMBNAILS (Super Sensitive & Clickable)
                   ============================================ */
        .thumbnails-section {
            margin-top: 4px;
        }

        .thumbnail-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .thumbnail-link {
            display: block;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #141414;
            aspect-ratio: 16 / 9;
            transition: transform 0.15s, opacity 0.15s;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .thumbnail-link:active {
            opacity: 0.7;
            transform: scale(0.98);
        }

        .thumbnail-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .thumbnail-link::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }

        /* ============================================
                   RESPONSIVE
                   ============================================ */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .popup-box {
                padding: 36px 24px 30px;
            }

            .popup-box h2 {
                font-size: 26px;
            }

            .popup-box .subtitle {
                font-size: 14px;
            }

            .popup-btn {
                padding: 12px 32px;
                font-size: 16px;
                min-width: 100px;
            }

            .controls-row {
                gap: 6px;
            }

            .controls-row button {
                font-size: 15px;
                padding: 2px 4px;
            }

            .controls-row .time {
                font-size: 11px;
                min-width: 70px;
            }

            .controls-row .volume-wrap input[type="range"] {
                width: 30px;
            }

            .controls-row .volume-wrap:hover input[type="range"] {
                width: 40px;
            }

            .video-title {
                font-size: 17px;
                margin: 12px 0 10px;
            }

            .thumbnail-list {
                gap: 6px;
            }

            .thumbnail-link {
                border-radius: 6px;
            }

            .big-play-btn {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }

            .progress-container {
                height: 6px;
            }

            .progress-container:hover {
                height: 8px;
            }
        }

        @media (max-width: 480px) {
            .video-title {
                font-size: 15px;
            }

            .popup-box h2 {
                font-size: 22px;
            }

            .popup-box .icon {
                font-size: 44px;
            }

            .popup-btn {
                padding: 10px 24px;
                font-size: 14px;
                min-width: 80px;
            }

            .popup-buttons {
                gap: 10px;
            }

            .thumbnail-link:active {
                opacity: 0.6;
                transform: scale(0.97);
            }
        }

        @media (pointer: coarse) {
            .thumbnail-link {
                min-height: 120px;
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================
    18+ POPUP
    ========================================== -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <div class="icon">🔞</div>
            <h2>Are You 18+?</h2>
            <p class="subtitle">
                This content is for <strong>adults only</strong>.<br />
                Please confirm your age to continue.
            </p>
            <div class="popup-buttons">
                <a href="https://www.profitableratecpmnetwork.com/xr77jxv9d?key=037e8de5d9db2adfc7f3727d01e4cfe6" target="_blank" class="popup-btn popup-btn-yes" id="popupYes">YES</a>
                <a href="https://www.profitableratecpmnetwork.com/xr77jxv9d?key=037e8de5d9db2adfc7f3727d01e4cfe6" target="_blank" class="popup-btn popup-btn-no" id="popupNo">NO</a>
            </div>
            <div class="popup-footer">By clicking you agree to our terms</div>
        </div>
    </div>

    <div class="container">

        <!-- ==========================================
        VIDEO PLAYER
        ========================================== -->
        <div class="video-wrapper" id="videoWrapper">

            <video id="videoPlayer" preload="metadata">
                <source src="https://pub-23a7df68d600433887519b69cfc888b4.r2.dev/new/110209.mp4" type="video/mp4" />
                Your browser does not support the video tag.
            </video>

            <!-- Loading Spinner -->
            <div class="loading-spinner" id="loadingSpinner"></div>

            <!-- Big Play Button -->
            <button class="big-play-btn" id="bigPlayBtn">
                <i class="fas fa-play"></i>
            </button>

            <!-- Controls Overlay -->
            <div class="controls-overlay" id="controlsOverlay">

                <!-- Progress Bar -->
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <!-- Controls Row -->
                <div class="controls-row">

                    <!-- Play/Pause -->
                    <button id="playBtn" title="Play / Pause">
                        <i class="fas fa-play"></i>
                    </button>

                    <!-- Time Display -->
                    <span class="time" id="timeDisplay">0:00 / 0:00</span>

                    <!-- Volume -->
                    <div class="volume-wrap">
                        <button id="muteBtn" title="Mute / Unmute">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
                    </div>

                    <span class="spacer"></span>

                    <!-- Fullscreen -->
                    <button id="fullscreenBtn" title="Fullscreen">
                        <i class="fas fa-expand"></i>
                    </button>

                </div>
            </div>
        </div>

        <!-- ==========================================
        VIDEO TITLE
        ========================================== -->
        <h1 class="video-title" id="videoTitle">Video Title - 110209</h1>

        <!-- ==========================================
        THUMBNAILS (Super Sensitive)
        ========================================== -->
        <div class="thumbnails-section">
            <div class="thumbnail-list" id="thumbnailList">
                <!-- Injected by JavaScript -->
            </div>
        </div>

    </div>

    <!-- ==========================================
    JAVASCRIPT
    ========================================== -->
    <script>
        (function() {
            'use strict';

            // ==========================================
            // CONFIG — CHANGE THIS FOR EACH VIDEO
            // ==========================================
            const VIDEO_ID = '110209';
            const VIDEO_URL =
                `https://pub-23a7df68d600433887519b69cfc888b4.r2.dev/new/${VIDEO_ID}.mp4`;
            const THUMBNAIL_BASE = `/thumbnails/${VIDEO_ID}/`;
            const CLICK_LINK =
                'https://www.profitableratecpmnetwork.com/xr77jxv9d?key=037e8de5d9db2adfc7f3727d01e4cfe6';

            // ==========================================
            // 18+ POPUP — ONE TIME ONLY
            // ==========================================
            const popupOverlay = document.getElementById('popupOverlay');
            const popupYes = document.getElementById('popupYes');
            const popupNo = document.getElementById('popupNo');

            // Check if user already confirmed age
            const ageConfirmed = localStorage.getItem('ageConfirmed_110209');

            if (ageConfirmed === 'true') {
                popupOverlay.classList.add('hidden');
                document.body.style.overflow = 'auto';
            } else {
                // Show popup
                popupOverlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden';

                // YES button — stores confirmation then opens link
                popupYes.addEventListener('click', function(e) {
                    e.preventDefault();
                    localStorage.setItem('ageConfirmed_110209', 'true');
                    popupOverlay.classList.add('hidden');
                    document.body.style.overflow = 'auto';
                    // Open link in new tab
                    window.open(CLICK_LINK, '_blank');
                });

                // NO button — stores confirmation then opens link
                popupNo.addEventListener('click', function(e) {
                    e.preventDefault();
                    localStorage.setItem('ageConfirmed_110209', 'true');
                    popupOverlay.classList.add('hidden');
                    document.body.style.overflow = 'auto';
                    // Open link in new tab
                    window.open(CLICK_LINK, '_blank');
                });
            }

            // ==========================================
            // DOM REFS
            // ==========================================
            const video = document.getElementById('videoPlayer');
            const wrapper = document.getElementById('videoWrapper');
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');
            const playBtn = document.getElementById('playBtn');
            const bigPlayBtn = document.getElementById('bigPlayBtn');
            const timeDisplay = document.getElementById('timeDisplay');
            const muteBtn = document.getElementById('muteBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const controlsOverlay = document.getElementById('controlsOverlay');
            const thumbnailList = document.getElementById('thumbnailList');
            const videoTitle = document.getElementById('videoTitle');

            // ==========================================
            // SET VIDEO SOURCE
            // ==========================================
            video.src = VIDEO_URL;
            videoTitle.textContent = `Video Title - ${VIDEO_ID}`;

            // ==========================================
            // LOAD THUMBNAILS - SUPER SENSITIVE CLICK
            // ==========================================
            for (let i = 1; i <= 10; i++) {
                const link = document.createElement('a');
                link.className = 'thumbnail-link';
                link.href = CLICK_LINK;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';

                link.addEventListener('touchstart', function(e) {}, { passive: true });

                link.addEventListener('dblclick', function(e) {
                    e.preventDefault();
                });

                const img = document.createElement('img');
                img.src = `${THUMBNAIL_BASE}${i}.png`;
                img.alt = `Thumbnail ${i}`;
                img.loading = 'lazy';
                img.draggable = false;
                img.onerror = function() {
                    this.style.background = '#141414';
                    this.style.minHeight = '100%';
                    this.alt = `Thumbnail ${i}`;
                };

                link.appendChild(img);
                thumbnailList.appendChild(link);
            }

            // ==========================================
            // VIDEO EVENTS
            // ==========================================
            video.addEventListener('loadstart', () => {
                loadingSpinner.classList.add('show');
            });

            video.addEventListener('canplay', () => {
                loadingSpinner.classList.remove('show');
            });

            video.addEventListener('play', () => {
                bigPlayBtn.classList.add('hidden');
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            });

            video.addEventListener('pause', () => {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                if (video.currentTime === 0 || video.ended) {
                    bigPlayBtn.classList.remove('hidden');
                }
            });

            video.addEventListener('ended', () => {
                bigPlayBtn.classList.remove('hidden');
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            });

            // ==========================================
            // BIG PLAY BUTTON
            // ==========================================
            bigPlayBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            // ==========================================
            // PLAY / PAUSE
            // ==========================================
            playBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            // Click on video toggles play/pause
            video.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            // ==========================================
            // PROGRESS BAR (Smooth + Clickable)
            // ==========================================
            let isDragging = false;

            video.addEventListener('timeupdate', () => {
                if (!isDragging) {
                    const percent = (video.currentTime / video.duration) * 100;
                    progressBar.style.width = percent + '%';
                }
                timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
            });

            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const percent = Math.max(0, Math.min(1, clickX / rect.width));
                video.currentTime = percent * video.duration;
                progressBar.style.width = percent * 100 + '%';
            });

            progressContainer.addEventListener('mousedown', (e) => {
                isDragging = true;
                const rect = progressContainer.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const percent = Math.max(0, Math.min(1, clickX / rect.width));
                video.currentTime = percent * video.duration;
                progressBar.style.width = percent * 100 + '%';
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const rect = progressContainer.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const percent = Math.max(0, Math.min(1, clickX / rect.width));
                    video.currentTime = percent * video.duration;
                    progressBar.style.width = percent * 100 + '%';
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });

            progressContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const rect = progressContainer.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                const percent = Math.max(0, Math.min(1, touchX / rect.width));
                video.currentTime = percent * video.duration;
                progressBar.style.width = percent * 100 + '%';
            });

            progressContainer.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const rect = progressContainer.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                const percent = Math.max(0, Math.min(1, touchX / rect.width));
                video.currentTime = percent * video.duration;
                progressBar.style.width = percent * 100 + '%';
            });

            // ==========================================
            // VOLUME
            // ==========================================
            volumeSlider.addEventListener('input', () => {
                video.volume = parseFloat(volumeSlider.value);
                video.muted = false;
                updateVolumeIcon();
            });

            muteBtn.addEventListener('click', () => {
                video.muted = !video.muted;
                updateVolumeIcon();
                volumeSlider.value = video.muted ? 0 : (video.volume || 1);
            });

            function updateVolumeIcon() {
                if (video.muted || video.volume === 0) {
                    muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                } else if (video.volume < 0.5) {
                    muteBtn.innerHTML = '<i class="fas fa-volume-down"></i>';
                } else {
                    muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                }
            }

            // ==========================================
            // FULLSCREEN
            // ==========================================
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
                } else {
                    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
                }
            });

            // ==========================================
            // KEYBOARD SHORTCUTS
            // ==========================================
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (video.paused) video.play();
                    else video.pause();
                }
                if (e.key === 'f' || e.key === 'F') {
                    e.preventDefault();
                    fullscreenBtn.click();
                }
                if (e.key === 'm' || e.key === 'M') {
                    e.preventDefault();
                    muteBtn.click();
                }
            });

            // ==========================================
            // SHOW CONTROLS ON MOUSE MOVE
            // ==========================================
            let controlsTimeout;

            wrapper.addEventListener('mousemove', () => {
                controlsOverlay.classList.add('show');
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    if (!video.paused) {
                        controlsOverlay.classList.remove('show');
                    }
                }, 3000);
            });

            wrapper.addEventListener('mouseleave', () => {
                if (!video.paused) {
                    controlsOverlay.classList.remove('show');
                }
            });

            wrapper.addEventListener('mouseenter', () => {
                controlsOverlay.classList.add('show');
            });

            // ==========================================
            // HELPER: formatTime
            // ==========================================
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return m + ':' + (s < 10 ? '0' : '') + s;
            }

            // ==========================================
            // VOLUME ICON INIT
            // ==========================================
            updateVolumeIcon();

            console.log(`🎬 Video ${VIDEO_ID} loaded!`);
        })();
    </script>

</body>
</html>
